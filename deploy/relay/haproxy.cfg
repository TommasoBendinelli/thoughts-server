# Thoughts public relay (installed by deploy/relay/setup-relay.sh).
#
# HAProxy forwards raw TCP only.  It never terminates TLS and holds no
# certificate or key: Caddy on the Fedora server owns the certificate for the
# public name.  HTTPS connections start with a PROXY protocol v2 header so
# Caddy sees the real client address.  The Fedora server is reached
# over WireGuard at 10.77.0.2; no IP forwarding or NAT is configured here.

global
    log /dev/log local0
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    user haproxy
    group haproxy
    daemon
    maxconn 4096

defaults
    mode tcp
    log global
    option tcplog
    option dontlognull
    # Fail fast when the WireGuard tunnel or Caddy is down.
    timeout connect 10s
    # Idle limits before the connection becomes a tunnel.
    timeout client 1h
    timeout server 1h
    # In TCP mode an established connection is a tunnel; this inactivity limit
    # supersedes the client and server timeouts.  WebSocket notifications,
    # streamed build logs, and long renders can stay quiet for a long time.
    timeout tunnel 24h
    timeout client-fin 30s
    timeout server-fin 30s

# HTTPS, including TLS-ALPN-01 certificate challenges.  IPv4 only: publish an
# A record for the public name and no AAAA record.
frontend thoughts_https
    bind :443
    default_backend fedora_https

backend fedora_https
    server fedora 10.77.0.2:443 send-proxy-v2

# Plain HTTP for ACME HTTP-01 challenges and Caddy's HTTP->HTTPS redirect.
frontend thoughts_http
    bind :80
    default_backend fedora_http

backend fedora_http
    # Caddy creates its HTTP redirect/ACME listener at runtime, after the
    # Caddyfile's listener_wrappers are applied.  Send plain HTTP to it.
    server fedora 10.77.0.2:80

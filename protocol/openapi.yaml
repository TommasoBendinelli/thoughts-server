                      type: string
                      description: Standard base64; at most 20 MiB decoded, each side
                        <= 8192 px, <= 40 megapixels.
                    capture:
                      type: string
                      maxLength: 128
                  description: A picture sent with the reply (e.g. from the glasses
                    camera); same limits as image.

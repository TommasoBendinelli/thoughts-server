          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - note_id
              - title
              - image
              properties:
                note_id:
                  type: string
                  format: uuid
                title:
                  type: string
                  maxLength: 200
                message:
                  type: string
                  maxLength: 4000
                image:
                  type: object
                  required:
                  - media_type
                  - data_base64
                  properties:
                    media_type:
                      type: string
                      enum:
                      - image/png
                      - image/jpeg
                    data_base64:
                      type: string
                      description: Standard base64; at most 20 MiB decoded, each side
                        <= 8192 px, <= 40 megapixels.
                document_id:
                  type: string
                  maxLength: 128
                document_filename:
                  type: string
                  maxLength: 512
                review_card_id:

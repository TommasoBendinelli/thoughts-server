  /v1/library/imports:
    post:
      summary: Import Library Pdf
      operationId: import_library_pdf_v1_library_imports_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryImportRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryImportResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/library/url-imports:
    post:
      summary: Import Library Pdf From Url
      description: 'Download a PDF from an https URL and import it into a Library Project as the Mac''s
        Import document does (protocol/library-url-imports.md). A PDF the Project already has changes nothing
        and answers replayed: true.'
      operationId: import_library_pdf_from_url_v1_library_url_imports_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project, name, url]
              properties:
                project:
                  type: string
                  maxLength: 2000
                  description: The Project's id, or its name ignoring case.
                name:
                  type: string
                  maxLength: 150
                  description: The document name shown in the Library, e.g. the paper title.
                url:
                  type: string
                  maxLength: 4096
                  description: An https URL (port 443) on a public address that returns the PDF.
              additionalProperties: true
              title: Request
      responses:
        '200':
          description: 'Imported, or replayed: true when the Project already has this PDF.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: {type: boolean}
                  replayed: {type: boolean}
                  project_id: {type: string}
                  project: {type: string}
                  document_id: {type: string}
                  filename: {type: string}
                  name: {type: string}
                  sha256: {type: string}
                  size_bytes: {type: integer}
                  page_count: {type: integer}
                  source_url: {type: string}
        '404':
          description: 'error_code project_not_found.'
        '409':
          description: 'error_code project_ambiguous, filename_taken or import_refused (the Project change
            was refused, e.g. it changed on another device).'
        '413':
          description: 'error_code too_large (over 100 MiB).'
        '422':
          description: 'error_code invalid_url, invalid_name, address_refused, not_pdf or invalid_pdf.'
        '502':
          description: 'error_code download_failed (host not found, HTTP error, too many redirects, timeout).'
  /v1/review-card-merges:
    post:
      summary: Merge Review Cards
      description: "Merge 2 to 20 review cards of one document into one card, as the desktop's Merge cards\u2026
        does, in one transaction on the canonical source (protocol/review-card-merge.md). A retry with the same
        request_id answers the first result again."
      operationId: merge_review_cards_v1_review_card_merges_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_id, card_ids, source, expected_source_sha256]
              properties:
                request_id:
                  type: string
                  description: A fresh UUID for this merge; the same request answers its first result again.
                card_ids:
                  type: array
                  minItems: 2
                  maxItems: 20
                  items: {type: string}
                  description: Different card UUIDs of one document whose passages are marked in `source`.
                keep_card_id:
                  type: string
                  description: The card that stays (one of card_ids). Default, the one with the most reviews.
                question:
                  type: string
                  maxLength: 500
                  description: The merged card's question. Default, the cards' questions joined in reading order.
                source:
                  type: string
                  description: The source file holding every card's markers (its path as GET /v1/sources lists it).
                expected_source_sha256:
                  type: string
                  description: The SHA-256 of the source version the caller read.
              additionalProperties: false
              title: Request
      responses:
        '200':
          description: 'Merged, or replayed: true for a retry of the same request.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: {type: boolean}
                  state: {type: string}
                  replayed: {type: boolean}
                  request_id: {type: string}
                  kept_card_id: {type: string}
                  deleted_card_ids: {type: array, items: {type: string}}
                  delete_event_ids: {type: array, items: {type: string}}
                  card_order: {type: array, items: {type: string}}
                  question: {type: string}
                  source: {type: string}
                  source_sha256: {type: string}
                  passages: {type: integer}
                  card_revision: {type: integer}
                  document: {type: string}
        '409':
          description: 'error_code merge_refused (with the reason), card_unavailable, source_conflict (with
            current_source_sha256), invalid_source or request_conflict. Nothing changed.'
        '413':
          description: The request is too large.
        '422':
          description: 'error_code invalid_request.'
  /v1/review-card-pending-moves:
    post:
      summary: Create Pending Card Move
      description: "Move a review card onto lines of a pending agent proposal's proposed text: the move waits
        for the proposal and is made when the user accepts it, dropped when it is rejected or withdrawn
        (protocol/review-card-pending-moves.md). A retry with the same request_id answers the first result again."
      operationId: create_pending_card_move_v1_review_card_pending_moves_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_id, card_id, source, expected_source_sha256, start_line, end_line]
              properties:
                request_id:
                  type: string
                  description: A fresh UUID; it identifies the pending move, and the same request answers its first result again.
                card_id:
                  type: string
                  description: The card to move (one without source markers, e.g. on an imported PDF).
                source:
                  type: string
                  description: The note's main source (its path as GET /v1/sources lists it).
                expected_source_sha256:
                  type: string
                  description: The SHA-256 of the source version the caller read.
                start_line:
                  type: integer
                  description: One-based first line of the selection, in the version read; inside one pending proposal's proposed text.
                end_line:

              schema:
                $ref: '#/components/schemas/AgentNoteCreateResponse'
        '400':
          description: invalid_agent_note
        '404':
          description: agent_note_not_found
        '409':
          description: agent_note_conflict
        '413':
          description: agent_note_too_large
        '415':
          description: unsupported_image

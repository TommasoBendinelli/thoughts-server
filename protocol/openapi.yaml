  /v1/sync/preflight:
    post:
      summary: Retired Sync Preflight
      description: Retired reader preflight endpoint. Authenticated callers receive
        HTTP 426 and must use /v2/sync/plan with sync_transfer_plan_v2.
      operationId: retired_sync_preflight_v1_sync_preflight_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '426':
          description: Upgrade Required
          content:
            application/json:
              schema:
                type: object
                required:
                - detail
                properties:
                  detail:
                    type: object
                    required:
                    - required_capability
                    - endpoint
                    properties:
                      required_capability:
                        type: string
                        const: sync_transfer_plan_v2
                      endpoint:
                        type: string
                        const: /v2/sync/plan
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v2/sync/plan:
    post:
      summary: Sync Plan
      description: Resolve the exact immutable reader objects before synchronization
        starts.
      operationId: sync_plan_v2_sync_plan_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPlanRequest'
      responses:

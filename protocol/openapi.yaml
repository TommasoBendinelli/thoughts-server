  /v1/html-pages:
    get:
      summary: Get Html Pages
      operationId: get_html_pages_v1_html_pages_get
      parameters:
      - name: folder
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Folder
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Html Pages V1 Html Pages Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: 'A docs folder''s HTML pages (protocol/html-pages.md): every folder''s listed pages,
        or with folder one folder''s together with pages only its latest build inputs carry (unlisted_pages).'
    post:
      summary: Post Html Pages
      operationId: post_html_pages_v1_html_pages_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              title: Request
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Post Html Pages V1 Html Pages Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: Add, replace or remove pages of one folder in one change of its page list; each change
        names the page's current object (base_sha256). 409 html_page_changed, html_page_object_unavailable;
        422 invalid_folder, invalid_html_page_path, invalid_html_page, invalid_request (protocol/html-pages.md).
  /v1/html-editions/{pdf_sha256}:
    get:
      summary: Get Html Edition
      description: The HTML edition built beside one PDF version (current or older),

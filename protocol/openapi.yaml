      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reply_id
              - image
              properties:
                reply_id:
                  type: string
                  format: uuid
                image:
                  type: object
                  required:
                  - media_type
                  - data_base64
                  properties:
                    media_type:
                      type: string
                      enum:
                      - image/png
                      - image/jpeg
                    data_base64:
                      type: string
                      description: Standard base64; at most 20 MiB decoded, each side
                        <= 8192 px, <= 40 megapixels.
                strokes:
                  type: object
                  description: Stroke document schema 1 (protocol/agent-notes.md); <=
                    2 MiB, <= 5000 strokes, <= 200000 points.
                message:
                  type: string
                  maxLength: 4000
                photo:
                  type: object
                  required:
                  - media_type
                  - data_base64
                  properties:

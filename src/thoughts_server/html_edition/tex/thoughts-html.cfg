% make4ht/tex4ht configuration for the Thoughts HTML edition (html_edition/latex.py).
% Marker, label and link macros are handled by thoughts-html-layer.tex (loaded by the wrapper).
\Preamble{xhtml,html5,mathml,charset=utf-8,fn-in}
% Figures: a plain <img> with the authored path; the bundle step resolves it (PDF -> SVG).
% Going through graphicx's DVI driver for a PDF figure breaks every later formula
% (tex4ht then writes <mrow>q + 1</mrow> without token elements) and gives low-resolution PNGs.
\DeclareDocumentCommand\includegraphics{s O{} m}{%
  \HCode{<img class="thoughts-fig" src="\detokenize{#3}" data-opts="\detokenize{#2}" alt="figure" />}}
% Sources that use pdfTeX's image primitives directly (\pdfximage width..{file}
% \pdfrefximage\pdflastximage) cannot run in DVI mode: emit the same <img>.
\protected\def\pdfximage#1#{\thoughtsHtmlXimage}
\def\thoughtsHtmlXimage#1{\HCode{<img class="thoughts-fig" src="\detokenize{#1}" alt="figure" />}}
\protected\def\pdfrefximage#1{}
\def\pdflastximage{0 }
% tex4ht bug (TL2026 html-mml.4ht): \Configure{IMG} calls \EndPauseMathClass inside the
% alt attribute special, where it is written as text ("\special {t4ht^+}") instead of
% executed. Math classes then stay paused and every later formula loses its <mi>/<mo>/<mn>
% elements. Image alt texts here never contain math, so pausing is not needed at all.
\def\PauseMathClass{}
\def\EndPauseMathClass{}
% tex4ht redefines \mbox non-robustly. natbib writes author-year citation labels
% (ACM: "Chan et~al\mbox{.}") to the .aux expanded, so tex4ht internals end up in
% \bibcite and every later citation fails. Keep \mbox unexpanded in written text.
\let\thoughtsHtmlMbox\mbox
\protected\def\mbox{\thoughtsHtmlMbox}
\begin{document}
% acmart refuses any redefinition of \section ... \paragraph and \baselinestretch at the
% end of the document ("Please do not do this for ACM submissions!"); tex4ht must
% redefine them to emit HTML headings. Accept tex4ht's definitions as the originals.
\makeatletter
\ifdefined\ACM@origsection
  \let\ACM@origsection\section
  \let\ACM@origsubsection\subsection
  \let\ACM@origsubsubsection\subsubsection
  \let\ACM@origparagraph\paragraph
  \let\ACM@origbaselinestretch\baselinestretch
\fi
\makeatother
\EndPreamble
